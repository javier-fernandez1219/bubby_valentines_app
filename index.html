<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be My Valentine?</title>
    <meta name="description" content="A tiny Valentine’s page made with love." />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="stage">
      <main class="card" aria-live="polite">
        <p class="kicker">Hi bubs, quick question…</p>
        <h1 class="title">Will you be my Valentine?</h1>

        <p id="subtitle" class="subtitle">
          I'm a sucker for you
        </p>

        <div class="buttons">
          <button id="yesBtn" class="btn btn-yes" type="button">Yes!!</button>
          <button id="noBtn" class="btn btn-no" type="button">Nah you good</button>
        </div>
      </main>

      <section id="afterYes" class="after-yes" hidden>
        <figure class="after-yes__dog">
          <figcaption>i knew you'd say yes</figcaption>
          <img
            src="./angry_doggo.jpeg"
            alt="A tiny dog with a mischievous grin"
            loading="lazy"
          />
        </figure>

        <figure class="after-yes__cats">
          <figcaption>this is us</figcaption>
          <img
            src="./cats_hugging.jpeg"
            alt="Two cats cuddling"
            loading="lazy"
          />
        </figure>
      </section>
    </div>

    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <audio id="rizzAudio" preload="auto" src="./rizz-sound-effect.mp3"></audio>
    <audio id="marvinAudio" preload="auto" src="./marvin_gay.mp3"></audio>

    <script src="./script.js"></script>
  </body>
</html>
